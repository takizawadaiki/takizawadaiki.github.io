name: Rebuild Bench Dividend data
# Started by hand from the Actions tab. Pulls the bench split from NBA Stats, recomputes the
# statistics, and pushes the three data files to the "bench-rebuild" branch for review.
# Nothing on the live site changes until that branch is merged into main.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -r requirements-rebuild.txt
      - run: python rebuild_data.py --selftest
      - run: python rebuild_data.py
      - run: python reanalysis.py
      - name: Push the rebuilt data to a review branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bench-rebuild
          git add chart-values.json data-provenance.json audit-results.json
          git commit -m "Rebuild Bench Dividend data from NBA Stats"
          git push -f origin bench-rebuild
