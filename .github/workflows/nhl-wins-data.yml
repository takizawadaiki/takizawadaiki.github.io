name: NHL wins data
# Started by hand: Actions tab -> NHL wins data -> Run workflow.
# Downloads NHL play-by-play season by season, reduces each game to shot and goal counts, and commits the files in nhl-wins/data.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: Season start years, as a JSON list
        default: "[2010,2011,2012,2013,2014,2015,2016,2017,2018,2019,2020,2021,2022,2023,2024,2025]"
permissions:
  contents: write
jobs:
  season:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        season: ${{ fromJSON(inputs.seasons) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python nhl-wins/pipeline/season.py ${{ matrix.season }} out
      - uses: actions/upload-artifact@v4
        with:
          name: nw-${{ matrix.season }}
          path: out/*
          retention-days: 14
  teams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python nhl-wins/pipeline/teams.py out
      - uses: actions/upload-artifact@v4
        with:
          name: nw-teams
          path: out/*
          retention-days: 14
  combine:
    needs: [season, teams]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: nw-*
          path: nhl-wins/data
          merge-multiple: true
      - name: Commit data
        run: |
          ls -la nhl-wins/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nhl-wins/data
          git diff --cached --quiet && echo "No change." || git commit -m "Update NHL wins data from the NHL API"
          git pull --rebase
          git push
